[pytest]
testpaths = tests

# testisolation safety keys. All five are required; there are no defaults.
testisolation_sockets = deny
testisolation_socket_allowlist =
testisolation_unix_socket_allowlist =
testisolation_loopback = deny
testisolation_sandbox_required = false

# Optional: this project builds Go artifacts in some tests, so it keeps the Go
# caches warm across the HOME repoint.
testisolation_preserve =
    go_path
    go_cache
