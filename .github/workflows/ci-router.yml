# DO NOT EDIT -- generated by rlsbl monorepo sync
name: CI Router
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_all:
        description: Run every project's CI jobs, ignoring the paths filter. Use
          this to make a release candidate's members run their own CI on a 
          commit whose push window does not touch their paths.
        type: boolean
        required: false
        default: false
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.sha }}-${{ inputs.run_all }}
  cancel-in-progress: true
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      testisolation: ${{ steps.changes.outputs.testisolation }}
      go-testisolation: ${{ steps.changes.outputs.go-testisolation }}
      ts-testisolation: ${{ steps.changes.outputs.ts-testisolation }}
    steps:
    - uses: actions/checkout@v6
    - uses: dorny/paths-filter@v4
      id: changes
      with:
        filters: |
          testisolation:
            - 'python/**'
            - '.github/workflows/ci-router.yml'
            - '.rlsbl-monorepo/releasables/py-testisolation/CHANGELOG.md'
          go-testisolation:
            - 'go/**'
            - '.github/workflows/ci-router.yml'
            - '.rlsbl-monorepo/releasables/go-testisolation/CHANGELOG.md'
          ts-testisolation:
            - 'typescript/**'
            - '.github/workflows/ci-router.yml'
            - '.rlsbl-monorepo/releasables/ts-testisolation/CHANGELOG.md'
        predicate-quantifier: some-with-excludes
  testisolation-ci-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # requires-python: >= 3.11
        python-version: ['3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
    - run: uv python install ${{ matrix.python-version }}
    - run: uv sync --locked
    - run: uv run python -c "import testisolation"
    - name: Install gitleaks
      run: |
        GITLEAKS_VERSION=8.24.3
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
    - run: uv run pytest --rootdir .
    defaults:
      run:
        working-directory: python
    name: testisolation-ci / test
    needs:
    - detect
    if: (needs.detect.outputs.testisolation == 'true' || inputs.run_all)
  go-testisolation-ci-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      # setup-go reads go.mod's `toolchain` line first, then its `go` directive.
      # Declare the development Go in `toolchain` (go mod edit -toolchain=goX.Y.Z)
      # so CI tests with it; `go` stays the consumers' floor.
    - uses: actions/setup-go@v6
      with:
        go-version-file: go/go.mod
    - run: go vet ./...
    - run: go test ./... -race -short -timeout=10m
    defaults:
      run:
        working-directory: go
    name: go-testisolation-ci / test
    needs:
    - detect
    if: (needs.detect.outputs.go-testisolation == 'true' || inputs.run_all)
  ts-testisolation-ci-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines.node: >= 22 -- the scaffold's default matrix still lists 20,
        # which this package genuinely cannot run on: `node --test` gained glob
        # support in 21, and the test script passes one.
        node-version: [22, 24]
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install dependencies
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi
    - run: npm test --if-present
    - run: npm audit --audit-level=moderate || true
    defaults:
      run:
        working-directory: typescript
    name: ts-testisolation-ci / test
    needs:
    - detect
    if: (needs.detect.outputs.ts-testisolation == 'true' || inputs.run_all)
