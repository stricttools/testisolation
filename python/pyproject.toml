[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testisolation"
version = "0.3.0"
description = "Uncompromising test isolation: your tests structurally cannot touch your real files, secrets, or git identity -- First-class support for Go, Python with pytest, and TypeScript with Node"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "S. M. Hosseini", email = "m.hosseini@veliu.com" }]
keywords = [
    "testing",
    "test-isolation",
    "isolation",
    "sandbox",
    "security",
    "credentials",
    "pytest",
    "node-test",
    "rlsbl",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=7.0"]

[project.entry-points.pytest11]
testisolation = "testisolation.plugin"

[dependency-groups]
dev = ["pytest", "pytest-xdist"]

[tool.hatch.build.targets.wheel]
packages = ["src/testisolation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# testisolation is active in its own suite through the pytest11 entry point, so
# this project declares its safety stance like any other consumer.
testisolation_sockets = "deny"
testisolation_socket_allowlist = []
testisolation_unix_socket_allowlist = []
testisolation_loopback = "deny"
# No sandbox runner exists in this repo yet; the runner ships as a scaffold
# template from rlsbl. Flip to "true" at adoption.
testisolation_sandbox_required = "false"

[project.urls]
Homepage = "https://smmh.dev/testisolation/"
Documentation = "https://smmh.dev/testisolation/"
Repository = "https://github.com/stricttools/testisolation"
Issues = "https://github.com/stricttools/testisolation/issues"
Changelog = "https://github.com/stricttools/testisolation/blob/main/CHANGELOG.md"
