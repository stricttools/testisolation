[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stricttest"
version = "0.2.1"
description = "Uncompromising test isolation: your tests structurally cannot touch your real files, secrets, or git identity -- First-class support for Go, Python with pytest, and TypeScript with Node"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "S. M. Hosseini", email = "m.hosseini@veliu.com" }]
keywords = [
    "testing",
    "test-isolation",
    "isolation",
    "sandbox",
    "security",
    "credentials",
    "pytest",
    "node-test",
    "rlsbl",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=7.0"]

[project.entry-points.pytest11]
stricttest = "stricttest.plugin"

[dependency-groups]
dev = ["pytest", "pytest-xdist"]

[tool.hatch.build.targets.wheel]
packages = ["src/stricttest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# stricttest is active in its own suite through the pytest11 entry point, so
# this project declares its safety stance like any other consumer.
stricttest_sockets = "deny"
stricttest_socket_allowlist = []
stricttest_unix_socket_allowlist = []
stricttest_loopback = "deny"
# No sandbox runner exists in this repo yet; the runner ships as a scaffold
# template from rlsbl. Flip to "true" at adoption.
stricttest_sandbox_required = "false"

[project.urls]
Homepage = "https://smmh.dev/stricttest/"
Documentation = "https://smmh.dev/stricttest/"
Repository = "https://github.com/smm-h/stricttest"
Issues = "https://github.com/smm-h/stricttest/issues"
Changelog = "https://github.com/smm-h/stricttest/blob/main/CHANGELOG.md"
